<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой Магазин</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#dfe3e7;font-family:Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:8px;z-index:3}.card,.panel{background:#fffefcf2;border:1px solid #d7d9da;border-radius:14px;box-shadow:0 5px 20px #00000014;padding:9px 12px;color:#555;font-size:12px}.card b{font-size:14px;color:#222}.grow{flex:1}.controls{position:fixed;right:14px;top:64px;display:flex;gap:6px;z-index:4}.btn{border:1px solid #d5d8da;background:#fff;border-radius:11px;padding:9px 12px;font-weight:700;color:#222}.btn.active{background:#20252a;color:#fff}.bottom{position:fixed;left:14px;right:14px;bottom:14px;display:flex;gap:8px;z-index:4}.build{display:flex;gap:6px;flex-wrap:wrap}.build button{border:1px solid #d9dcde;background:#f4f5f5;border-radius:10px;padding:8px 10px}.hint{margin-left:auto;max-width:390px}.toast{position:fixed;top:75px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#20252a;color:#fff;padding:10px 14px;border-radius:11px;z-index:8;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.hint{display:none}.card{padding:7px 8px}.card:nth-child(3){display:none}.btn{padding:8px 9px}}</style></head>
<body><canvas id="c"></canvas>
<div class="hud"><div class="card">💰 <b id="m">100 000 ₽</b></div><div class="card">📈 <b id="p">0 ₽</b></div><div class="card">👥 <b id="n">0</b></div><div class="card">🕐 <b id="t">08:00</b></div><div class="grow"></div><div class="card">День <b id="d">1</b></div></div>
<div class="controls"><button class="btn" id="pause">▶</button><button class="btn active" id="x1">×1</button><button class="btn" id="x3">×3</button><button class="btn" id="reset">↻</button></div>
<div class="bottom"><div class="panel build"><button data-a="shelf">＋ Стеллаж 2 000 ₽</button><button data-a="cash">＋ Касса 6 000 ₽</button><button data-a="stock">📦 Товар 3 000 ₽</button></div><div class="panel hint">Перетаскивай магазин пальцем/мышью. Колёсико или pinch — масштаб. Нажми ▶ и запусти первый день.</div></div><div class="toast" id="toast"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
let S={money:100000,profit:0,day:1,h:8,min:0,run:false,speed:1,z:.9,cx:0,cy:35,stock:30},people=[],objects=[
{x:-4,y:-2,k:'s'},{x:0,y:-2,k:'s'},{x:4,y:-2,k:'s'},{x:-4,y:2,k:'s'},{x:0,y:2,k:'s'},{x:4,y:2,k:'s'},{x:3.7,y:3,k:'c'}];
function M(v){return Math.round(v).toLocaleString('ru-RU')+' ₽'}function I(a,b,h=0){let q=50*S.z;return{x:W/2+(a-b)*q*.72+S.cx,y:H/2+(a+b)*q*.36-h*q*.72+S.cy}}
function poly(a,f,s){x.beginPath();a.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fillStyle=f;x.fill();if(s){x.strokeStyle=s;x.stroke()}}
function dia(p,w,h,f,s){poly([{x:p.x,y:p.y-h/2},{x:p.x+w/2,y:p.y},{x:p.x,y:p.y+h/2},{x:p.x-w/2,y:p.y}],f,s)}
function ground(){let a=I(-5.5,-4),b=I(5.5,-4),d=I(-5.5,4),e=I(5.5,4);poly([a,b,e,d],'#eef0ee','#c9cdcf');for(let i=-5;i<=5;i++){let p=I(i,-4),q=I(i,4);x.strokeStyle='#cfd3d4';x.globalAlpha=.35;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}x.globalAlpha=1;for(let i=-1;i<=1;i++){let p=I(-7,i*2);dia(p,65*S.z,32*S.z,'#d7dbdc')}for(let [a,b] of [[-7,-3],[7,-3],[-7,3],[7,3]]){let p=I(a,b);x.fillStyle='#6d8';x.fillRect(p.x-2,p.y-24*S.z,5,24*S.z);dia({x:p.x,y:p.y-27*S.z},28*S.z,19*S.z,'#9bd63b')}let h=1.8,aa=I(-5.5,-4,h),bb=I(5.5,-4,h),dd=I(-5.5,4,h),ee=I(5.5,4,h);poly([a,b,bb,aa],'#fafafa','#c7cacc');poly([d,e,ee,dd],'#f5f6f6','#c7cacc');for(let q=-4;q<=4;q+=2){let p=I(q,4,.5),r=I(q+1,4,.5),u=I(q+1,4,1.3),v=I(q,4,1.3);poly([p,r,u,v],'#d9e5e9','#aeb9bd')}}
function shelf(o){let p=I(o.x,o.y),z=S.z,w=57*z;dia({x:p.x,y:p.y+8*z},w+10*z,22*z,'#00000012');poly([{x:p.x-w/2,y:p.y},{x:p.x-w/2,y:p.y-35*z},{x:p.x,y:p.y-50*z},{x:p.x,y:p.y-15*z}],'#d9dcde','#aaafb2');poly([{x:p.x,y:p.y-15*z},{x:p.x,y:p.y-50*z},{x:p.x+w/2,y:p.y-35*z},{x:p.x+w/2,y:p.y}],'#f0f1f1','#aaafb2');for(let i=0;i<3;i++){let yy=p.y-(11+i*9)*z;dia({x:p.x,y:yy},w*.82,10*z,'#fafafa','#c8ccce');for(let j=0;j<4;j++){x.fillStyle=['#d85c50','#e3a43a','#6d8ed1','#76a56d'][j];x.beginPath();x.arc(p.x+(j-1.5)*8*z,yy-2*z,3*z,0,7);x.fill()}}}
function cash(o){let p=I(o.x,o.y),z=S.z;dia({x:p.x,y:p.y+4*z},58*z,25*z,'#00000012');poly([{x:p.x-22*z,y:p.y},{x:p.x-22*z,y:p.y-19*z},{x:p.x,y:p.y-28*z},{x:p.x,y:p.y-9*z}],'#d7d7d7','#aaa');poly([{x:p.x,y:p.y-9*z},{x:p.x,y:p.y-28*z},{x:p.x+22*z,y:p.y-19*z},{x:p.x+22*z,y:p.y}],'#f4f4f4','#aaa');dia({x:p.x,y:p.y-23*z},19*z,8*z,'#25292c')}
function drawPeople(){people.sort((a,b)=>a.y-b.y);for(let q of people){let p=I(q.x,q.y),z=S.z;x.fillStyle='#0002';x.beginPath();x.ellipse(p.x,p.y+7*z,7*z,4*z,0,0,7);x.fill();x.fillStyle=q.c;x.beginPath();x.arc(p.x,p.y-5*z,7*z,0,7);x.fill();x.fillStyle=q.s;x.beginPath();x.arc(p.x,p.y-13*z,5.5*z,0,7);x.fill();x.fillStyle='#292929';x.beginPath();x.arc(p.x,p.y-15*z,5*z,Math.PI,7);x.fill()}}
function spawn(){let a=Math.random()>.5?5.8:-5.8;people.push({x:a,y:4.7,tx:(Math.random()*8-4),ty:(Math.random()*5-2.5),state:0,w:.8+Math.random()*1.5,c:['#df806e','#789fd0','#d2a54e','#6da77a','#ad82c9'][Math.floor(Math.random()*5)],s:['#efc2a5','#d89c7a','#ae704f'][Math.floor(Math.random()*3)]})}
function tick(dt){if(!S.run)return;S.min+=dt*3*S.speed;if(S.min>=60){S.min-=60;S.h++}if(S.h>=22){S.h=8;S.day++;S.run=false;toast('День завершён')};if(Math.random()<dt*.55*S.speed&&people.length<18)spawn();for(let i=people.length-1;i>=0;i--){let q=people[i],dx=q.tx-q.x,dy=q.ty-q.y,dist=Math.hypot(dx,dy);if(q.state===0&&dist>.12){q.x+=dx/dist*dt*.8*S.speed;q.y+=dy/dist*dt*.8*S.speed}else if(q.state===0){q.state=1}else if(q.state===1){q.w-=dt*S.speed;if(q.w<=0){if(S.stock>0&&Math.random()<.78){S.stock--;let rev=220+Math.random()*580,mar=rev*.42;S.money+=mar;S.profit+=mar}q.state=2;q.tx=5.8;q.ty=4.7}}else if(q.state===2&&Math.hypot(q.tx-q.x,q.ty-q.y)<.15)people.splice(i,1)}}
function ui(){m.textContent=M(S.money);p.textContent=M(S.profit);n.textContent=people.length;t.textContent=String(S.h).padStart(2,'0')+':'+String(Math.floor(S.min)).padStart(2,'0');d.textContent=S.day}
function draw(){x.clearRect(0,0,W,H);ground();for(let o of objects)o.k==='s'?shelf(o):cash(o);let p=I(-7,-4);poly([{x:p.x-32*S.z,y:p.y},{x:p.x-32*S.z,y:p.y-25*S.z},{x:p.x-3*S.z,y:p.y-37*S.z},{x:p.x+24*S.z,y:p.y-25*S.z},{x:p.x+24*S.z,y:p.y}],'#fff','#b8bec1');drawPeople();let q=I(0,-4.15,2.2);x.fillStyle='#222';x.font='bold '+Math.max(14,18*S.z)+'px Arial';x.textAlign='center';x.fillText('МОЙ МАГАЗИН',q.x,q.y)}
function toastMsg(v){toastEl.textContent=v;toastEl.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('on'),1600)}window.toast=toastMsg;const toastEl=document.getElementById('toast');
pause.onclick=()=>{S.run=!S.run;pause.textContent=S.run?'Ⅱ':'▶';toast(S.run?'Магазин открыт':'Пауза')};x1.onclick=()=>{S.speed=1;S.run=true;x1.classList.add('active');x3.classList.remove('active')};x3.onclick=()=>{S.speed=3;S.run=true;x3.classList.add('active');x1.classList.remove('active')};reset.onclick=()=>location.reload();
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let a=b.dataset.a,cost=a==='shelf'?2000:a==='cash'?6000:3000;if(S.money<cost)return toast('Недостаточно денег');S.money-=cost;if(a==='stock')S.stock+=30;else objects.push({x:Math.round(Math.random()*8-4),y:Math.round(Math.random()*5-2.5),k:a==='shelf'?'s':'c'});toast(a==='stock'?'+30 товара':'Объект установлен')});
let drag=0,lx=0,ly=0;c.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){S.cx+=e.clientX-lx;S.cy+=e.clientY-ly;lx=e.clientX;ly=e.clientY}};c.onpointerup=()=>drag=0;c.onwheel=e=>{e.preventDefault();S.z=Math.max(.55,Math.min(1.45,S.z*(e.deltaY<0?1.08:.93)))};
let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;tick(dt);ui();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
