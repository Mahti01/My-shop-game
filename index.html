<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Мой Магазин — 0.4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9ecee;font-family:Inter,Arial,sans-serif;color:#202428}
body{touch-action:none}canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;top:14px;left:16px;right:16px;display:flex;gap:9px;z-index:10;pointer-events:none}
.card,.panel{background:rgba(255,255,255,.94);border:1px solid #d9dddf;border-radius:14px;box-shadow:0 6px 24px rgba(30,40,45,.09);padding:9px 12px;font-size:12px;color:#6a7075;backdrop-filter:blur(8px)}
.card b{font-size:14px;color:#202428}.grow{flex:1}
.controls{position:fixed;right:16px;top:68px;display:flex;gap:7px;z-index:12}
.btn{border:1px solid #d6dadd;background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;color:#30353a;box-shadow:0 4px 16px rgba(30,40,45,.08)}
.btn.active{background:#252a2e;color:#fff;border-color:#252a2e}
.bottom{position:fixed;left:16px;right:16px;bottom:15px;display:flex;gap:9px;z-index:12}
.build{display:flex;gap:7px;flex-wrap:wrap}.build button{border:1px solid #d8dcde;background:#f5f6f6;border-radius:11px;padding:9px 11px;color:#2e3337;font-weight:600}
.hint{margin-left:auto;max-width:430px;line-height:1.35}.toast{position:fixed;top:82px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#24292d;color:#fff;padding:10px 15px;border-radius:12px;z-index:20;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.hud{top:10px;left:10px;right:10px;gap:5px}.card{padding:7px 8px}.card:nth-child(3){display:none}.controls{right:10px;top:60px}.btn{padding:8px 9px}.bottom{left:10px;right:10px;bottom:10px}.hint{display:none}.build button{padding:8px 9px;font-size:11px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
<div class="card">💰 <b id="money">100 000 ₽</b></div>
<div class="card">📈 <b id="profit">0 ₽</b></div>
<div class="card">👥 <b id="customers">0</b></div>
<div class="card">📦 <b id="stock">30</b></div>
<div class="grow"></div><div class="card">День <b id="day">1</b> · <b id="clock">08:00</b></div>
</div>
<div class="controls">
<button class="btn" id="pause">▶</button><button class="btn active" id="speed1">×1</button><button class="btn" id="speed3">×3</button><button class="btn" id="reset">↻</button>
</div>
<div class="bottom">
<div class="panel build">
<button data-build="shelf">＋ Стеллаж · 2 000 ₽</button>
<button data-build="cash">＋ Касса · 6 000 ₽</button>
<button data-build="decor">＋ Декор · 800 ₽</button>
<button data-build="stock">📦 Закупить · 3 000 ₽</button>
</div>
<div class="panel hint">Покупатели теперь идут к конкретной категории, покупают товар и уходят. 📦 «Закупить» пополняет все категории. Камера: drag / колесо / pinch.</div>
</div>
<div class="toast" id="toast"></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const S={money:100000,profit:0,day:1,h:8,min:0,running:false,speed:1,zoom:.92,cx:0,cy:42,
stock:{'МОЛОЧНОЕ':5,'НАПИТКИ':5,'СЛАДОСТИ':5,'ОВОЩИ':5,'БАКАЛЕЯ':5,'КРАСОТА':5}};
const shop={w:11,h:8};
const objects=[
{x:-4.2,y:-2.2,k:'s',cat:'МОЛОЧНОЕ'},{x:0,y:-2.2,k:'s',cat:'НАПИТКИ'},{x:4.2,y:-2.2,k:'s',cat:'СЛАДОСТИ'},
{x:-4.2,y:1.7,k:'s',cat:'ОВОЩИ'},{x:0,y:1.7,k:'s',cat:'БАКАЛЕЯ'},{x:4.2,y:1.7,k:'s',cat:'КРАСОТА'},
{x:3.5,y:3.15,k:'cash'},{x:-4.8,y:3.0,k:'decor'},{x:4.8,y:-3.1,k:'decor'},
{x:-5.0,y:-.2,k:'cooler'},{x:5.0,y:-.2,k:'cooler'}
];
const PRODUCTS={
'МОЛОЧНОЕ':{price:190,cost:105,color:'#f4e7c1'},
'НАПИТКИ':{price:240,cost:130,color:'#8eb7d9'},
'СЛАДОСТИ':{price:280,cost:150,color:'#d99aaf'},
'ОВОЩИ':{price:170,cost:90,color:'#8bb36d'},
'БАКАЛЕЯ':{price:320,cost:180,color:'#c89b62'},
'КРАСОТА':{price:520,cost:290,color:'#b58ac5'}
};
function totalStock(){return Object.values(S.stock).reduce((a,b)=>a+b,0)}
function randomCategory(){
const keys=Object.keys(S.stock).filter(k=>S.stock[k]>0);
return keys.length?keys[Math.floor(Math.random()*keys.length)]:null;
}
const people=[];

function money(v){return Math.round(v).toLocaleString('ru-RU')+' ₽'}
function iso(x,y,z=0){const q=52*S.zoom;return{x:W/2+(x-y)*q*.72+S.cx,y:H/2+(x+y)*q*.36-z*q*.72+S.cy}}
function poly(a,fill,stroke){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function diamond(p,w,h,fill,stroke){poly([{x:p.x,y:p.y-h/2},{x:p.x+w/2,y:p.y},{x:p.x,y:p.y+h/2},{x:p.x-w/2,y:p.y}],fill,stroke)}
function line(a,b,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}

function drawWorld(){
ctx.clearRect(0,0,W,H);
const A=iso(-7,-5),B=iso(7,-5),C=iso(7,5),E=iso(-7,5);
poly([A,B,C,E],'#e5e8e8','#c9cdcf');
for(let i=-7;i<=7;i++){line(iso(i,-5),iso(i,5),'rgba(145,151,155,.20)');}
for(let i=-5;i<=5;i++){line(iso(-7,i),iso(7,i),'rgba(145,151,155,.20)');}
drawParking();drawShop();drawRoadDetails();drawCheckoutArea();drawTruck();
objects.sort((a,b)=>a.y-b.y);
for(const o of objects){if(o.k==='s')drawShelf(o);else if(o.k==='cash')drawCash(o);else if(o.k==='cooler')drawCooler(o);else drawDecor(o)}
drawPeople();drawSign();
}
function drawParking(){
for(const [x,y] of [[-6.8,-3.7],[-6.8,3.7],[6.8,-3.7],[6.8,3.7]]){const p=iso(x,y);diamond(p,64*S.zoom,31*S.zoom,'#d5d9da','#c1c6c7')}
for(const [x,y] of [[-6.7,-3.8],[6.7,-3.8],[-6.7,3.8],[6.7,3.8]]){const p=iso(x,y);ctx.fillStyle='#6d6f72';ctx.fillRect(p.x-2,p.y-21*S.zoom,4,21*S.zoom);diamond({x:p.x,y:p.y-25*S.zoom},27*S.zoom,18*S.zoom,'#a5dc45')}
}
function drawShop(){
const a=iso(-5.5,-4),b=iso(5.5,-4),c=iso(5.5,4),d=iso(-5.5,4),h=1.85;
const ah=iso(-5.5,-4,h),bh=iso(5.5,-4,h),ch=iso(5.5,4,h),dh=iso(-5.5,4,h);
poly([a,b,bh,ah],'#fbfbfa','#c7cbcd');poly([d,c,ch,dh],'#f4f5f5','#c7cbcd');
for(let q=-4;q<=4;q+=2){
let p=iso(q,4,.5),r=iso(q+.9,4,.5),u=iso(q+.9,4,1.35),v=iso(q,4,1.35);
poly([p,r,u,v],'#d9e6ea','#aeb8bd')
}
let door=iso(-.5,4.02,0),door2=iso(.7,4.02,0),top2=iso(.7,4.02,1.5),top=iso(-.5,4.02,1.5);
poly([door,door2,top2,top],'#b8c9cf','#89989e');
}
function drawRoadDetails(){
const p=iso(0,5.1);ctx.fillStyle='#b9bdbe';ctx.fillRect(p.x-70*S.zoom,p.y,140*S.zoom,4*S.zoom);
}
function drawTruck(){
const p=iso(-7,-4.2),z=S.zoom;
poly([{x:p.x-35*z,y:p.y},{x:p.x-35*z,y:p.y-27*z},{x:p.x-4*z,y:p.y-40*z},{x:p.x+26*z,y:p.y-27*z},{x:p.x+26*z,y:p.y}],'#fff','#b9bec0');
diamond({x:p.x-5*z,y:p.y-5*z},50*z,25*z,'#eef1f2','#b9bec0');
for(const dx of [-22,15]){ctx.fillStyle='#303438';ctx.beginPath();ctx.arc(p.x+dx*z,p.y+2*z,5*z,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#7e9da5';ctx.font='bold '+(7*z)+'px Arial';ctx.textAlign='center';ctx.fillText('АРЕНДА',p.x,p.y-20*z)
}
function drawShelf(o){
const p=iso(o.x,o.y),z=S.zoom,w=62*z;
diamond({x:p.x,y:p.y+8*z},w+10*z,23*z,'rgba(0,0,0,.08)');
poly([{x:p.x-w/2,y:p.y},{x:p.x-w/2,y:p.y-36*z},{x:p.x,y:p.y-51*z},{x:p.x,y:p.y-15*z}],'#d6d9da','#a7adb0');
poly([{x:p.x,y:p.y-15*z},{x:p.x,y:p.y-51*z},{x:p.x+w/2,y:p.y-36*z},{x:p.x+w/2,y:p.y}],'#f1f2f2','#a7adb0');
for(let i=0;i<3;i++){
const yy=p.y-(11+i*10)*z;diamond({x:p.x,y:yy},w*.82,10*z,'#fafafa','#c8ccce');
for(let j=0;j<5;j++){ctx.fillStyle=PRODUCTS[o.cat]?.color||['#d55d52','#e4a23b','#6d8fd2','#74a76e','#c67b9c'][j];ctx.beginPath();ctx.arc(p.x+(j-2)*8*z,yy-2*z,3*z,0,Math.PI*2);ctx.fill()}
}
if(o.cat){
ctx.fillStyle='#596168';ctx.font='700 '+Math.max(6,7*z)+'px Arial';ctx.textAlign='center';
ctx.fillText(o.cat,p.x,p.y-56*z);
ctx.fillStyle='#ffffff';ctx.font='700 '+Math.max(7,9*z)+'px Arial';
ctx.fillText('×'+(S.stock[o.cat]||0),p.x,p.y-45*z);
}
}
function drawCash(o){
const p=iso(o.x,o.y),z=S.zoom;
diamond({x:p.x,y:p.y+5*z},65*z,27*z,'rgba(0,0,0,.08)');
poly([{x:p.x-24*z,y:p.y},{x:p.x-24*z,y:p.y-20*z},{x:p.x,y:p.y-30*z},{x:p.x,y:p.y-10*z}],'#d6d6d6','#a7aaac');
poly([{x:p.x,y:p.y-10*z},{x:p.x,y:p.y-30*z},{x:p.x+24*z,y:p.y-20*z},{x:p.x+24*z,y:p.y}],'#f5f5f5','#a7aaac');
diamond({x:p.x,y:p.y-24*z},20*z,8*z,'#272c30');
}
function drawCooler(o){
const p=iso(o.x,o.y),z=S.zoom,w=58*z;
diamond({x:p.x,y:p.y+6*z},w+8*z,22*z,'rgba(0,0,0,.08)');
poly([{x:p.x-w/2,y:p.y},{x:p.x-w/2,y:p.y-42*z},{x:p.x,y:p.y-56*z},{x:p.x,y:p.y-14*z}],'#d9e5e8','#9eafb5');
poly([{x:p.x,y:p.y-14*z},{x:p.x,y:p.y-56*z},{x:p.x+w/2,y:p.y-42*z},{x:p.x+w/2,y:p.y}],'#edf5f6','#9eafb5');
for(let i=0;i<3;i++){let yy=p.y-(19+i*10)*z;diamond({x:p.x,y:yy},w*.72,8*z,'#bcd9df','#9eafb5')}
}
function drawDecor(o){
const p=iso(o.x,o.y),z=S.zoom;ctx.fillStyle='#6d8b59';ctx.fillRect(p.x-2,p.y-20*z,4,20*z);diamond({x:p.x,y:p.y-24*z},28*z,19*z,'#92c84b','#719b3c');
}
function drawPeople(){
people.sort((a,b)=>a.y-b.y);
for(const q of people){const p=iso(q.x,q.y),z=S.zoom;
ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(p.x,p.y+7*z,7*z,4*z,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=q.clothes;ctx.beginPath();ctx.arc(p.x,p.y-5*z,7*z,0,Math.PI*2);ctx.fill();
ctx.fillStyle=q.skin;ctx.beginPath();ctx.arc(p.x,p.y-14*z,5.5*z,0,Math.PI*2);ctx.fill();
ctx.fillStyle=q.hair;ctx.beginPath();ctx.arc(p.x,p.y-16*z,5*z,Math.PI,Math.PI*2);ctx.fill();
if(q.state===1){ctx.fillStyle='#fff';ctx.font='bold '+(8*z)+'px Arial';ctx.textAlign='center';ctx.fillText('₽',p.x,p.y-25*z)}
}}
function drawCheckoutArea(){
const p=iso(3.3,3.85);diamond(p,105*S.zoom,42*S.zoom,'rgba(215,194,150,.32)');
ctx.fillStyle='#7d6a4e';ctx.font='700 '+Math.max(8,9*S.zoom)+'px Arial';ctx.textAlign='center';ctx.fillText('КАССА',p.x,p.y+2*S.zoom)
}
function spawnCustomer(){
const cat=randomCategory();
if(!cat)return;
const shelf=objects.find(o=>o.k==='s'&&o.cat===cat);
const entrance=Math.random()>.5?[-5.8,4.8]:[5.8,4.8];
people.push({x:entrance[0],y:entrance[1],tx:shelf?shelf.x:0,ty:shelf?shelf.y:0,targetCat:cat,state:0,
wait:.8+Math.random()*1.5,
clothes:['#df806e','#789fd0','#d1a54f','#70a778','#ad82c9','#e58baf'][Math.floor(Math.random()*6)],
skin:['#efc3a6','#d99f7e','#b97855'][Math.floor(Math.random()*3)],hair:'#2b2928'})
}
function simulate(dt){
if(!S.running)return;
S.min+=dt*3*S.speed;
if(S.min>=60){S.min-=60;S.h++}
if(S.h>=22){S.h=8;S.day++;S.running=false;toast('День завершён — магазин закрыт')}
if(Math.random()<dt*.5*S.speed&&people.length<20)spawnCustomer();
for(let i=people.length-1;i>=0;i--){
const q=people[i],dx=q.tx-q.x,dy=q.ty-q.y,dist=Math.hypot(dx,dy);
if(q.state===0&&dist>.12){q.x+=dx/dist*dt*.82*S.speed;q.y+=dy/dist*dt*.82*S.speed}
else if(q.state===0)q.state=1;
else if(q.state===1){q.wait-=dt*S.speed;if(q.wait<=0){
const cat=q.targetCat, p=PRODUCTS[cat];
if(cat&&S.stock[cat]>0){
S.stock[cat]--;
const revenue=p.price;
const margin=p.price-p.cost;
S.money+=margin;S.profit+=margin;
q.bought=true;
toast('Продажа: '+cat+' +'+money(margin));
}else{
q.bought=false;
}
q.state=2;q.tx=5.8;q.ty=4.8;
}}
else if(q.state===2&&Math.hypot(q.tx-q.x,q.ty-q.y)<.16)people.splice(i,1);
}}
function updateUI(){
moneyEl.textContent=money(S.money);profitEl.textContent=money(S.profit);customersEl.textContent=people.length;stockEl.textContent=totalStock();
clockEl.textContent=String(S.h).padStart(2,'0')+':'+String(Math.floor(S.min)).padStart(2,'0');dayEl.textContent=S.day;
}
function drawSign(){const p=iso(0,-4.18,2.25);ctx.fillStyle='#22272b';ctx.font='800 '+Math.max(15,19*S.zoom)+'px Arial';ctx.textAlign='center';ctx.fillText('МОЙ МАГАЗИН',p.x,p.y)}
function toast(v){const e=document.getElementById('toast');e.textContent=v;e.classList.add('on');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('on'),1700)}
const moneyEl=document.getElementById('money'),profitEl=document.getElementById('profit'),customersEl=document.getElementById('customers'),stockEl=document.getElementById('stock'),clockEl=document.getElementById('clock'),dayEl=document.getElementById('day');

document.getElementById('pause').onclick=()=>{S.running=!S.running;document.getElementById('pause').textContent=S.running?'Ⅱ':'▶';toast(S.running?'Магазин открыт':'Пауза')};
document.getElementById('speed1').onclick=()=>{S.speed=1;S.running=true;document.getElementById('speed1').classList.add('active');document.getElementById('speed3').classList.remove('active')};
document.getElementById('speed3').onclick=()=>{S.speed=3;S.running=true;document.getElementById('speed3').classList.add('active');document.getElementById('speed1').classList.remove('active')};
document.getElementById('reset').onclick=()=>location.reload();

document.querySelectorAll('[data-build]').forEach(btn=>btn.onclick=()=>{
const kind=btn.dataset.build,cost=kind==='shelf'?2000:kind==='cash'?6000:kind==='decor'?800:3000;
if(S.money<cost){toast('Недостаточно денег');return}S.money-=cost;
if(kind==='stock'){
const total=Object.keys(S.stock).reduce((sum,k)=>sum+S.stock[k],0);
if(total>=60){toast('Склад заполнен');S.money+=cost;return}
for(const k of Object.keys(S.stock))S.stock[k]+=5;
toast('+5 каждой категории');
return}
objects.push({x:Math.round(Math.random()*8-4),y:Math.round(Math.random()*5-2.5),k:kind==='shelf'?'s':kind==='cash'?'cash':'decor'});
toast('Объект установлен');
});

let drag=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;S.cx+=e.clientX-lastX;S.cy+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',e=>{
drag=false;
if(Math.abs(e.clientX-lastX)<4&&Math.abs(e.clientY-lastY)<4){
  const q=(e.clientX-W/2-S.cx)/(52*S.zoom*.72);
}
});
canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();S.zoom=Math.max(.55,Math.min(1.5,S.zoom*(e.deltaY<0?1.08:.93)))},{passive:false});

let pinch=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)S.zoom=Math.max(.55,Math.min(1.5,S.zoom*d/pinch));pinch=d}},{passive:true});

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;simulate(dt);updateUI();drawWorld();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
